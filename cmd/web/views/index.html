<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livetracking</title>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #map {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #date-select {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 1000;
        }

        #org-select {
            position: absolute;
            top: 20px;
            left: 160px;
            z-index: 1000;
        }

        #legend {
            position: absolute;
            top: 20px;
            left: 290px;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            flex-direction: column;
        }
        #legend div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            cursor: pointer;
            user-select: none;
        }
        #legend div.disabled {
            opacity: 0.4;
            text-decoration: line-through;
        }
        #legend .color-box {
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        #legend .pilot-name {
            margin-right: 6px;
        }
        #legend .pilot-stats {
            font-size: 0.85em;
            color: #555;
        }
        #toggle-markers-btn {
            position: absolute;
            top: 20px;
            left: 150px;
            z-index: 1000;
            background: none;
            border: none;
            cursor: pointer;
        }
        #show-all-btn {
            margin-top: 8px;
            font-size: 0.85em;
            cursor: pointer;
            color: #0078ff;
            background: none;
            border: none;
            padding: 0;
        }
        #show-all-btn:hover {
            text-decoration: underline;
        }

        .leaflet-div-icon {
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            line-height: 30px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div id="map-wrap">
        <div id="map"></div>

        <div id="legend"></div>
    </div>

    <dif id="controls">
        <select id="date-select" name="date"></select>
        <select id="org-select" name="org"></select>
        <button id="toggle-markers-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="${color}" class="bi bi-geo-alt-fill" viewBox="0 0 16 16" style="margin-right: 4px;">
                <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
            </svg>
        </button>
    </div>

    <script>
        // convertDurationToTime converts nanoseconds duration to a string format hh:mm:ss.
        function convertDurationtoTime(duration) {
            const dateObj = new Date(duration / 1000000);
            const hours = dateObj.getUTCHours();
            const minutes = dateObj.getUTCMinutes();
            const seconds = dateObj.getSeconds();

            return hours.toString().padStart(2, '0')
                + ':' + minutes.toString().padStart(2, '0')
                + ':' + seconds.toString().padStart(2, '0');
        }

        function getSelectedDate() {
            const selectElement = document.getElementById("date-select");
            if (selectElement && selectElement.options.length > 0) {
                return selectElement.options[selectElement.selectedIndex].value;
            }
            return "";
        }

        function loadDates() {
            fetch("/dates")
                .then(function(resp) {
                    if (!resp.ok) throw new Error("HTTP " + resp.status);
                    return resp.json();
                })
                .then(function(dates) {
                    const select = document.getElementById("date-select");
                    const today = new Date().toISOString().split('T')[0];

                    dates.forEach(function(date) {
                        const opt = document.createElement("option");
                        opt.value = date;
                        if (date === today) {
                            opt.textContent = "Today";
                        } else {
                            opt.textContent = date;
                        }
                        select.appendChild(opt);
                    });
                })
                .catch(function(err) {
                    console.error("Failed to load dates:", err);
                });
        }

        function loadTracks(date) {
            fetch(`/tracks/${date}`)
                .then(function(resp) {
                    if (!resp.ok) throw new Error("HTTP " + resp.status);
                    return resp.json();
                })
                .then(function(data) {
                    updateMapData(data);
                })
                .catch(function(err) {
                    console.error("Failed to load tracks:", err);
                });
        }

        var eventSource = new EventSource("{{ .EventsEndpoint }}");

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("New track point received: ", data);

            const selectedDate = getSelectedDate();
            const today = new Date();
            const formattedDateToday = today.toISOString().split('T')[0];

            if (selectedDate === formattedDateToday) {
                loadTracks(selectedDate);
            }
        };

        eventSource.onerror = function() {
            console.log("SSE connection lost, attempting to reconnect...");
        };

        var START_COLOR = '#5f65d3';
        var OK_COLOR = '#21772a';

        var map = L.map('map', {zoomControl: false}).setView([51.505, -0.09], 3);
        var pilotGroups = {};
        var currentData = {};
        var pilotVisibility = {};
        var showAllMarkers = false;
        var pilotOrgs = {{ .PilotOrgs }};
        var selectedOrg = "";

        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var colors = [
            '#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080', '#ffffff', '#000000'
        ];

        function populateOrgs() {
            fetch("/orgs")
                .then(function(resp) {
                    if (!resp.ok) throw new Error("HTTP " + resp.status);
                    return resp.json();
                })
                .then(function(orgs) {
                    const select = document.getElementById("org-select");
                    const allOpt = document.createElement("option");
                    allOpt.value = "";
                    allOpt.textContent = "All organizations";
                    select.appendChild(allOpt);

                    orgs.forEach(function(org) {
                        const opt = document.createElement("option");
                        opt.value = org;
                        opt.textContent = org;
                        select.appendChild(opt);
                    });
                })
                .catch(function(err) {
                    console.error("Failed to load orgs:", err);
                });
        }

        function filterByOrg(org) {
            selectedOrg = org;
            Object.keys(pilotGroups).forEach(function(pilot) {
                var isInOrg = !org || (pilotOrgs[pilot] && pilotOrgs[pilot].indexOf(org) !== -1);
                if (isInOrg) {
                    if (pilotVisibility[pilot] !== false) {
                        pilotGroups[pilot].addTo(map);
                    }
                } else {
                    map.removeLayer(pilotGroups[pilot]);
                }
            });
            updateLegendState();
        }

        function updateMapData(pilotData) {
            Object.values(pilotGroups).forEach(function(group) { map.removeLayer(group); });
            pilotGroups = {};
            currentData = pilotData;

            const legend = document.getElementById("legend");
            legend.style.display = "none";
            legend.textContent = "";

            const allLatLngs = [];
            const pilotMap = new Map(Object.entries(pilotData));

            let colorIndex = 0;
            Array.from(pilotMap.entries()).forEach(function([pilot, points]) {
                const group = L.layerGroup();
                const latLngs = points.map(function(point) { return [point.latitude, point.longitude]; });
                const color = colors[colorIndex % colors.length];
                colorIndex++;

                L.polyline(latLngs, { color: color }).addTo(group);

                points.forEach(function(point, i) {
                    allLatLngs.push([point.latitude, point.longitude]);

                    const isKeyMarker = i == 0 || point.msgType == 'OK' || window.showAllMarkers || i == points.length -1
                    if (!showAllMarkers && !isKeyMarker) {
                        return;
                    }

                    let pointColor = color;
                    let pointText = String(i);
                    if (point.msgType === 'OK') {
                        pointColor = OK_COLOR;
                        pointText = "OK";
                    }
                    if (i === 0) {
                        pointColor = START_COLOR;
                        pointText = "ST";
                    }

                    const icon = L.divIcon({
                        className: 'leaflet-div-icon',
                        html: '<div style="background-color: ' + pointColor + '; width: 100%; height: 100%; border-radius: 50%; display: flex; justify-content: center; align-items: center;">' + pointText + '</div>',
                        iconSize: [30, 30],
                        iconAnchor: [15, 15],
                    });

                    const marker = L.marker([point.latitude, point.longitude], { icon: icon }).addTo(group);

                    marker.bindPopup(
                        '<strong>' + pilot + '</strong><br>' +
                        'DateTime: ' + new Date(point.dateTime).toLocaleString() + '<br>' +
                        'Altitude: ' + point.altitude + ' m<br>' +
                        'MsgType: ' + point.msgType + '<br>' +
                        'MsgContent: ' + point.msgContent + '<br>' +
                        'CumulativeDist: ' + point.cumDist.toFixed(2) + ' km<br>' +
                        'AvgSpeed: ' + point.avgSpeed.toFixed(2) + ' km/h<br>' +
                        'LegDist: ' + point.legDist.toFixed(2) + ' km'
                    );
                });

                if (pilotVisibility[pilot] !== false) {
                    var isInOrg = !selectedOrg || (pilotOrgs[pilot] && pilotOrgs[pilot].indexOf(selectedOrg) !== -1);
                    if (isInOrg) {
                        group.addTo(map);
                    }
                }

                pilotGroups[pilot] = group;

                const lastPoint = points[points.length - 1];

                const legendItem = document.createElement("div");
                if (pilotVisibility[pilot] === false) {
                    legendItem.className = "disabled";
                }
                legendItem.dataset.pilot = pilot;
                legendItem.innerHTML =
                    '<span class="color-box" style="background-color: ' + color + ';"></span>' +
                    '<span class="pilot-name">' + pilot + '</span>' +
                    '<span class="pilot-stats">' +
                    convertDurationtoTime(lastPoint.flightTime) + ' ' +
                    lastPoint.altitude + ' m ' +
                    lastPoint.cumDist.toFixed(2) + ' km ' +
                    lastPoint.avgSpeed.toFixed(1) + ' km/h ' +
                    new Date(lastPoint.dateTime).toLocaleString() +
                    '</span>';

                legendItem.addEventListener("click", function(e) {
                    togglePilot(pilot);
                });

                legendItem.addEventListener("dblclick", function(e) {
                    e.preventDefault();
                    soloPilot(pilot);
                });

                legend.appendChild(legendItem);
            });

            const showAllBtn = document.createElement("button");
            showAllBtn.id = "show-all-btn";
            showAllBtn.textContent = "Show all";
            showAllBtn.addEventListener("click", function() {
                showAllPilots();
            });
            legend.appendChild(showAllBtn);

            if (allLatLngs.length > 0) {
                legend.style.display = "flex";
                map.fitBounds(allLatLngs);
            }
        }

        function togglePilot(pilot) {
            const group = pilotGroups[pilot];
            if (!group) return;

            const visible = pilotVisibility[pilot] !== false;
            pilotVisibility[pilot] = !visible;

            if (visible) {
                map.removeLayer(group);
            } else {
                group.addTo(map);
            }

            updateLegendState();
        }

        function soloPilot(pilot) {
            const anyHidden = Object.values(pilotVisibility).some(function(v) { return v === false; });
            const onlyThisVisible = !anyHidden || (pilotVisibility[pilot] !== false && Object.keys(pilotVisibility).every(function(p) { return p === pilot || pilotVisibility[p] === false; }));

            if (onlyThisVisible && !anyHidden) {
                Object.keys(pilotGroups).forEach(function(p) {
                    pilotVisibility[p] = p === pilot;
                    if (p === pilot) {
                        pilotGroups[p].addTo(map);
                    } else {
                        map.removeLayer(pilotGroups[p]);
                    }
                });
            } else {
                Object.keys(pilotGroups).forEach(function(p) {
                    pilotVisibility[p] = true;
                    pilotGroups[p].addTo(map);
                });
            }

            updateLegendState();
        }

        function showAllPilots() {
            Object.keys(pilotGroups).forEach(function(p) {
                pilotVisibility[p] = true;
                pilotGroups[p].addTo(map);
            });
            updateLegendState();
        }

        function updateLegendState() {
            const legendItems = document.querySelectorAll("#legend div[data-pilot]");
            legendItems.forEach(function(item) {
                const pilot = item.dataset.pilot;
                var isInOrg = !selectedOrg || (pilotOrgs[pilot] && pilotOrgs[pilot].indexOf(selectedOrg) !== -1);
                if (!isInOrg || pilotVisibility[pilot] === false) {
                    item.className = "disabled";
                } else {
                    item.className = "";
                }
            });
        }

        var initialData = {{ .Tracks }}
        updateMapData(initialData);
        loadDates();
        populateOrgs();

        window.addEventListener('resize', function() { map.invalidateSize(); });

        document.getElementById("date-select").addEventListener("change", function() {
            const date = this.value;
            if (date) {
                pilotVisibility = {};
                loadTracks(date);
            }
        });
        document.getElementById("org-select").addEventListener("change", function() {
            filterByOrg(this.value);
        });
        document.getElementById("toggle-markers-btn").addEventListener("click", () => {
            showAllMarkers = !showAllMarkers;
            this.textContent = showAllMarkers ? "Show key markers" : "Show all markers";
            updateMapData(currentData);
        });
    </script>
</body>
</html>
